[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonfeat"
version = "0.1.0"
description = "IPA and X-SAMPA tokenization, conversion, and distinctive feature analysis."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "David Jiménez" }]
keywords = ["linguistics", "phonology", "phonetics", "ipa", "xsampa", "features"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "lingcore>=0.1.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
ods = ["odfpy>=1.4"]
dev = ["pytest>=7.4", "pytest-cov>=5.0"]

[project.urls]
Repository = "https://github.com/<your-user>/phonfeat"
Issues = "https://github.com/<your-user>/phonfeat/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/phonfeat"]

[tool.hatch.build.targets.wheel.force-include]
"src/phonfeat/data" = "phonfeat/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
